name: Dashboard Summary

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run validator
        run: |
          mkdir -p .github/reports
          if [ -f setup/validate.sh ]; then
            sh setup/validate.sh > .github/reports/validation.log 2>&1 || echo "Validation failed"
          fi
      - name: Create summary
        env:
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repository "$REPO" \
            --arg workflow "dashboard" \
            --arg status "complete" \
            '{timestamp: $timestamp, repository: $repository, workflow: $workflow, status: $status}' > .github/reports/validation-summary.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary
          path: .github/reports/
